<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Metallic Studio — Line Drawing</title>
    <!-- Importing Tailwind CSS for clean and modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #080808;
        }
        /* Chocolate-toned checkerboard background for transparent areas */
        .checkerboard {
            background-color: #110d0a;
            background-image: 
                linear-gradient(45deg, #17120e 25%, transparent 25%, transparent 75%, #17120e 75%, #17120e), 
                linear-gradient(45deg, #17120e 25%, transparent 25%, transparent 75%, #17120e 75%, #17120e);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }
        /* Custom thin scrollbar */
        .scrollbar-thin::-webkit-scrollbar {
            width: 4px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(251, 146, 60, 0.15);
            border-radius: 2px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: rgba(251, 146, 60, 0.3);
        }
    </style>
    <!-- Three.js and OrbitControls libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="overflow-hidden h-screen w-screen text-slate-100 flex">

    <!-- Left Sidebar Control Panel -->
    <div id="ui-panel" class="w-80 h-full bg-stone-900/95 border-r border-stone-800 flex flex-col z-20 backdrop-blur-xl shrink-0">
        <!-- Header (3D METAL BRUSH replaced with clean LINE DRAWING, no gear emoji) -->
        <div class="p-5 border-b border-stone-800">
            <h1 class="text-lg font-bold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-stone-100 to-orange-400 flex items-center gap-2">
                LINE DRAWING
            </h1>
            <p class="text-xs text-stone-500 mt-1">Professional line drawing with ultra-smoothing</p>
        </div>

        <!-- Mode Toggle (Draw / Inspect) with outlined SVG icons -->
        <div class="px-5 pt-4">
            <div class="flex bg-stone-950 p-1 rounded-lg border border-stone-800">
                <button id="mode-draw" class="flex-1 flex items-center justify-center gap-2 py-2 text-xs font-semibold rounded-md transition-all bg-stone-100 text-stone-950">
                    <!-- Outlined Pen Icon -->
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
                    </svg>
                    Draw
                </button>
                <button id="mode-inspect" class="flex-1 flex items-center justify-center gap-2 py-2 text-xs font-semibold rounded-md text-stone-400 hover:text-orange-400 transition-all">
                    <!-- Outlined Inspect/Search Icon -->
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.637 10.637z" />
                    </svg>
                    Inspect 3D
                </button>
            </div>
        </div>

        <!-- Scrollable Settings Container -->
        <div class="flex-1 overflow-y-auto px-5 py-4 space-y-5 scrollbar-thin">
            
            <!-- ULTRA-SMOOTHING PARAMETERS -->
            <div id="section-draw" class="space-y-4">
                <h3 class="text-orange-400 text-[10px] font-bold tracking-wider uppercase mb-1 flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 21l8.982-8.982m-1.132-1.132L21 3l-5.093 5.093m0 0l-5.093 5.093M11 19h.008v.008H11V19zm.375 0a.375 0 11-.75 0 .375 0 01.75 0zm-.375-3h.008v.008H11V16zm.375 0a.375 0 11-.75 0 .375 0 01.75 0zm-.375-3h.008v.008H11V13zm.375 0a.375 0 11-.75 0 .375 0 01.75 0zm-.375-3h.008v.008H11V10zm.375 0a.375 0 11-.75 0 .375 0 01.75 0zm-.375-3h.008v.008H11V7zm.375 0a.375 0 11-.75 0 .375 0 01.75 0z" />
                    </svg>
                    Ultra-Smoothing
                </h3>

                <div class="bg-orange-950/20 border border-orange-900/20 rounded-lg p-3">
                    <label class="flex justify-between text-[11px] text-orange-400 font-semibold uppercase tracking-wider mb-2">
                        <span>Loop Separation (Z)</span>
                        <span id="val-separation">10.0</span>
                    </label>
                    <input type="range" id="separation" min="0.0" max="20.0" step="0.5" value="10.0" class="w-full accent-orange-500 h-1 bg-stone-800 rounded-lg appearance-none">
                </div>

                <div class="space-y-3 pt-1">
                    <div>
                        <label class="flex justify-between text-xs text-stone-400 mb-1">
                            <span>Laplace Smoothing</span>
                            <span id="val-smoothing">50</span>
                        </label>
                        <input type="range" id="smoothing" min="0" max="100" step="1" value="50" class="w-full accent-orange-500 h-1 bg-stone-800 rounded-lg appearance-none">
                    </div>
                    <div>
                        <label class="flex justify-between text-xs text-stone-400 mb-1">
                            <span>Line Thickness</span>
                            <span id="val-thickness">0.2</span>
                        </label>
                        <input type="range" id="thickness" min="0.1" max="1.5" step="0.05" value="0.2" class="w-full accent-orange-500 h-1 bg-stone-800 rounded-lg appearance-none">
                    </div>
                </div>
            </div>

            <!-- BACKGROUND REFERENCE (IMAGE UNDERLAY) -->
            <div class="border-t border-stone-800 pt-4 space-y-4">
                <h3 class="text-stone-400 text-xs font-bold tracking-wider uppercase mb-1 flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375 0 11-.75 0 .375 0 01.75 0z" />
                    </svg>
                    Background Reference
                </h3>
                <div class="flex gap-2">
                    <button id="upload-bg-btn" class="flex-1 flex items-center justify-center gap-1.5 py-2 text-xs font-semibold bg-stone-800 rounded border border-stone-700 hover:bg-stone-700 hover:text-white transition-all text-stone-300">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375 0 11-.75 0 .375 0 01.75 0z" />
                        </svg>
                        Upload Image
                    </button>
                    <button id="remove-bg-btn" class="px-3 py-2 text-xs font-semibold bg-red-950 text-red-400 border border-red-900/40 rounded hover:bg-red-900/30 transition-all hidden">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h14" />
                        </svg>
                    </button>
                </div>
                <input type="file" id="bg-file-input" accept="image/*" class="hidden">
                
                <div id="bg-controls" class="space-y-3 hidden bg-stone-950 p-3 rounded-lg border border-stone-800/80">
                    <div>
                        <label class="flex justify-between text-xs text-stone-400 mb-1">
                            <span>Image Opacity</span>
                            <span id="val-bg-opacity">50%</span>
                        </label>
                        <input type="range" id="bg-opacity" min="10" max="100" step="5" value="50" class="w-full accent-orange-500 bg-stone-800 h-1 rounded-lg appearance-none">
                    </div>
                    <div>
                        <label class="flex justify-between text-xs text-stone-400 mb-1">
                            <span>Image Scale</span>
                            <span id="val-bg-scale">1.0x</span>
                        </label>
                        <input type="range" id="bg-scale" min="0.2" max="3.0" step="0.1" value="1.0" class="w-full accent-orange-500 bg-stone-800 h-1 rounded-lg appearance-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="flex justify-between text-xs text-stone-400 mb-1">
                                <span>Offset X</span>
                                <span id="val-bg-offset-x">0</span>
                            </label>
                            <input type="range" id="bg-offset-x" min="-20" max="20" step="0.5" value="0" class="w-full accent-orange-500 bg-stone-800 h-1 rounded-lg appearance-none">
                        </div>
                        <div>
                            <label class="flex justify-between text-xs text-stone-400 mb-1">
                                <span>Offset Y</span>
                                <span id="val-bg-offset-y">0</span>
                            </label>
                            <input type="range" id="bg-offset-y" min="-20" max="20" step="0.5" value="0" class="w-full accent-orange-500 bg-stone-800 h-1 rounded-lg appearance-none">
                        </div>
                    </div>
                </div>
            </div>

            <!-- STUDIO LIGHTS -->
            <div class="border-t border-stone-800 pt-4 space-y-4">
                <h3 class="text-orange-400 text-xs font-bold tracking-wider uppercase mb-1 flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                    </svg>
                    Studio Lights
                </h3>

                <div>
                    <label class="flex justify-between text-xs text-stone-400 mb-1">
                        <span>Key Light Intensity</span>
                        <span id="val-keyIntensity">2.0</span>
                    </label>
                    <input type="range" id="keyIntensity" min="0.0" max="5.0" step="0.1" value="2.0" class="w-full accent-orange-500 h-1 bg-stone-800 rounded-lg appearance-none">
                </div>

                <div>
                    <label class="flex justify-between text-xs text-stone-400 mb-1">
                        <span>Fill Light Intensity</span>
                        <span id="val-fillIntensity">1.2</span>
                    </label>
                    <input type="range" id="fillIntensity" min="0.0" max="4.0" step="0.1" value="1.2" class="w-full accent-orange-500 h-1 bg-stone-800 rounded-lg appearance-none">
                </div>
            </div>

            <!-- METAL MATERIAL PARAMETERS -->
            <div class="border-t border-stone-800 pt-4 space-y-4">
                <h3 class="text-stone-400 text-xs font-bold tracking-wider uppercase mb-1 flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.94-3.197a5.971 5.971 0 00-.94 3.197M15 6.75a3 3 0 11-6 0 3 3 0 016 0zm6 3a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zm-13.5 0a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z" />
                    </svg>
                    Metal Material
                </h3>
                
                <div class="grid grid-cols-2 gap-2">
                    <button id="preset-chrome" class="py-1.5 text-[11px] font-semibold bg-stone-800 rounded border border-stone-700 hover:bg-stone-700 transition-all text-neutral-300">
                        Mirror Chrome
                    </button>
                    <button id="preset-satin" class="py-1.5 text-[11px] font-semibold bg-orange-950/60 text-orange-400 rounded border border-orange-900/60 hover:bg-orange-900/40 transition-all shadow-sm shadow-orange-500/10">
                        Matte Satin
                    </button>
                </div>

                <div>
                    <label class="flex justify-between text-xs text-stone-400 mb-1">
                        <span>Roughness</span>
                        <span id="val-roughness">0.28</span>
                    </label>
                    <input type="range" id="roughness" min="0.0" max="0.8" step="0.01" value="0.28" class="w-full accent-orange-500 h-1 bg-stone-800 rounded-lg appearance-none">
                </div>

                <div>
                    <label class="text-xs text-stone-400 block mb-1">Metal Color</label>
                    <div class="flex items-center gap-2">
                        <input type="color" id="color" value="#e6e6e6" class="w-10 h-8 border-0 p-0 rounded cursor-pointer bg-transparent">
                        <span id="color-hex" class="text-xs text-stone-500 uppercase">#e6e6e6</span>
                    </div>
                </div>

                <!-- Transparent Background Selector -->
                <div class="flex items-center justify-between bg-stone-950 p-2.5 rounded-lg border border-stone-800/80">
                    <label for="transparent-bg" class="text-xs text-stone-400 cursor-pointer flex items-center gap-2">
                        <input type="checkbox" id="transparent-bg" checked class="accent-orange-500 w-4 h-4 rounded">
                        <span>Transparent Background (PNG)</span>
                    </label>
                </div>
            </div>

            <!-- EXPORT OPTIONS -->
            <div class="border-t border-stone-800 pt-4 space-y-2">
                <h3 class="text-stone-400 text-xs font-bold tracking-wider uppercase mb-1 flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Export Project
                </h3>
                <button id="export-png-btn" class="w-full bg-gradient-to-r from-orange-600 to-amber-500 hover:from-orange-500 hover:to-amber-400 text-stone-950 font-bold py-2.5 rounded-lg transition-all shadow-md shadow-orange-600/10 text-xs flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
                    </svg>
                    Download PNG (4x Ultra Quality)
                </button>
            </div>
        </div>

        <!-- Reset & Clear scene actions -->
        <div class="p-4 border-t border-stone-800 grid grid-cols-2 gap-2">
            <button id="reset-settings-btn" class="flex items-center justify-center gap-1 bg-stone-800 hover:bg-stone-700 text-stone-300 border border-stone-700 text-xs font-semibold py-2 rounded-lg transition-all">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
                Reset Settings
            </button>
            <button id="clear-btn" class="flex items-center justify-center gap-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 text-xs font-semibold py-2 rounded-lg transition-all">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Clear Scene
            </button>
        </div>
    </div>

    <!-- WebGL viewport & drawing overlay canvas -->
    <div id="canvas-container" class="flex-1 h-full relative overflow-hidden">
        <div id="viewport" class="w-full h-full checkerboard"></div>
        <canvas id="drawing-overlay" class="absolute top-0 left-0 w-full h-full z-10 cursor-crosshair"></canvas>
        
        <!-- Viewport mode helper toast -->
        <div class="absolute bottom-5 right-5 bg-stone-900/80 backdrop-blur-md border border-stone-800/80 px-4 py-2.5 rounded-xl z-20 text-xs text-stone-400 pointer-events-none">
            <span id="view-mode-indicator">Draw a line on the screen</span>
        </div>
    </div>

    <!-- UI Toast notification element -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-orange-500 text-stone-950 font-bold px-6 py-2.5 rounded-full text-xs shadow-lg shadow-orange-500/20 z-50 pointer-events-none opacity-0 translate-y-10 transition-all duration-300">
        Saved successfully
    </div>

    <script>
        let scene, camera, renderer, controls, currentLineMeshes = [];
        let material, envMap, grainyTexture;
        let drawingCanvas, ctxDrawing;
        let raycaster, mousePosition;
        let isDrawing = false;
        let currentPathPoints = [];
        let activeTubeMesh = null;
        let clock;
        
        // Studio lights
        let ambientLight, keyLight, fillLight;
        
        // Background reference storage
        let bgMesh = null, bgTexture = null;
        
        // Raw line data arrays for dynamically updating geometry
        let drawnLines = []; // [{ rawPoints: THREE.Vector3[], mesh: THREE.Mesh }]
        
        // Stabilizer coordinates placeholders
        let lastMouseX = null;
        let lastMouseY = null;
        
        let activeMorphs = [];
        let currentMode = 'draw'; // 'draw' or 'inspect'

        // Initialize on start
        init();
        animate();

        function init() {
            clock = new THREE.Clock();

            const viewport = document.getElementById('viewport');
            scene = new THREE.Scene();

            // 1. Camera setup
            camera = new THREE.PerspectiveCamera(40, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 30);

            // 2. Renderer setup with preservation for export
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            viewport.appendChild(renderer.domElement);

            // 3. Studio lights setup
            // Ambient intensity fixed to 0.13 as requested
            ambientLight = new THREE.AmbientLight(0xffffff, 0.13);
            scene.add(ambientLight);

            keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
            keyLight.position.set(-15, 20, 15);
            scene.add(keyLight);

            fillLight = new THREE.DirectionalLight(0xddeeff, 1.2);
            fillLight.position.set(15, -10, 10);
            scene.add(fillLight);

            // 4. 2D Drawing Overlay Canvas setup
            drawingCanvas = document.getElementById('drawing-overlay');
            ctxDrawing = drawingCanvas.getContext('2d');
            resizeDrawingCanvas();

            // Setup OrbitControls bound to the drawing canvas
            controls = new THREE.OrbitControls(camera, drawingCanvas);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enabled = false;

            // 5. Environmental Reflection Map (Softboxes)
            envMap = createStudioEnvironmentMap();
            scene.environment = envMap;

            // 6. Brushed satin metal micro-texture
            grainyTexture = createGrainyMetalTexture();

            // 7. Base PBR material with default Satin values and custom edge shadow injection
            material = new THREE.MeshStandardMaterial({
                color: 0xe6e6e6,
                metalness: 1.0,
                roughness: 0.28,
                envMap: envMap,
                envMapIntensity: 2.0,
                bumpMap: grainyTexture,
                bumpScale: 0.004, // Reduced default from 0.025 to 0.004 for a much smoother, polished surface
                flatShading: false
            });

            material.onBeforeCompile = function (shader) {
                // Replace the dithering code block with our custom edge-shadow calculation logic with verified settings from Снимок экрана — 2026-06-17 в 16.09.01.png
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <dithering_fragment>',
                    `#include <dithering_fragment>
                     vec3 normalVec = normalize(vNormal);
                     vec3 viewVec = normalize(vViewPosition);
                     float dotNV = clamp(abs(dot(normalVec, viewVec)), 0.0, 1.0);
                     
                     // Verified default edge shadow parameters from Снимок экрана — 2026-06-17 в 16.09.01.png
                     float edgeShadowWidth = 0.8;
                     float edgeShadowIntensity = 1.0;
                     float edgeShadowSharpness = 1.0;
                     
                     // 1. Calculate the initial smoothstep based on Shadow Width
                     float edgeDarken = smoothstep(0.0, edgeShadowWidth, dotNV);
                     
                     // 2. Apply Shadow Sharpness (as an exponential curve)
                     edgeDarken = pow(edgeDarken, edgeShadowSharpness);
                     
                     // 3. Interpolate between full color (1.0) and shaded color based on Shadow Intensity
                     float mixFactor = mix(1.0, edgeDarken, edgeShadowIntensity);
                     
                     gl_FragColor.rgb *= mixFactor;
                    `
                );
            };

            raycaster = new THREE.Raycaster();
            mousePosition = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
            setupDrawingHandlers();
            setupUIHandlers();
            
            // Sync all numeric UI labels
            updateUIOutputLabels();
        }

        // Procedural softbox light map generator
        function createStudioEnvironmentMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#060608';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Left key softbox
            let grad1 = ctx.createLinearGradient(120, 0, 380, 0);
            grad1.addColorStop(0, 'rgba(255, 255, 255, 0)');
            grad1.addColorStop(0.5, 'rgba(255, 255, 255, 1)');
            grad1.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad1;
            ctx.fillRect(120, 0, 260, canvas.height);

            // Right fill softbox
            let grad2 = ctx.createLinearGradient(680, 0, 820, 0);
            grad2.addColorStop(0, 'rgba(255, 255, 255, 0)');
            grad2.addColorStop(0.5, 'rgba(230, 245, 255, 0.95)');
            grad2.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad2;
            ctx.fillRect(680, 0, 140, canvas.height);

            // Upper ambient softbox
            let grad3 = ctx.createLinearGradient(0, 20, 0, 180);
            grad3.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
            grad3.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad3;
            ctx.fillRect(0, 0, canvas.width, 200);

            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            return texture;
        }

        // Procedural satin grain generator
        function createGrainyMetalTexture() {
            const canvas = document.createElement('canvas');
            const size = 128;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(size, size);

            for (let i = 0; i < imgData.data.length; i += 4) {
                const noise = 128 + Math.floor((Math.random() - 0.5) * 45);
                imgData.data[i] = noise;
                imgData.data[i + 1] = noise;
                imgData.data[i + 2] = noise;
                imgData.data[i + 3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(128, 128);
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            return texture;
        }

        // Calculate 3D points from mouse coordinate projection
        function get3DPointFromEvent(event) {
            const rect = drawingCanvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            mousePosition.x = (x / drawingCanvas.width) * 2 - 1;
            mousePosition.y = -(y / drawingCanvas.height) * 2 + 1;

            raycaster.setFromCamera(mousePosition, camera);
            if (Math.abs(raycaster.ray.direction.z) < 0.0001) return null;

            const distance = -raycaster.ray.origin.z / raycaster.ray.direction.z;
            if (isNaN(distance) || !isFinite(distance)) return null;

            const point = raycaster.ray.at(distance);
            if (isNaN(point.x) || isNaN(point.y) || isNaN(point.z)) return null;

            return point;
        }

        // Reconstruction with 3D Depth separation
        function rebuildPathWith3DDepth(points) {
            const n = points.length;
            if (n < 4) return points;

            // 1. Smooth points with Laplace algorithm
            const smoothPasses = parseInt(document.getElementById('smoothing').value);
            const flatPoints = smoothPoints(points, smoothPasses);
            
            const targetPoints = flatPoints.map(p => p.clone());
            const count = targetPoints.length;

            // Generate spatial baseline wave
            for (let i = 0; i < count; i++) {
                const progress = i / (count - 1);
                targetPoints[i].z = Math.sin(progress * Math.PI * 3) * 1.0;
            }

            // Loop intersection calculation and height translation offset
            const thickness = parseFloat(document.getElementById('thickness').value);
            const sepFactor = parseFloat(document.getElementById('separation').value);
            const offsetHeight = thickness * sepFactor * 2.2;
            const influenceWidth = Math.max(16, Math.floor(count * 0.05));

            for (let i = 0; i < count - 1; i++) {
                for (let j = i + 16; j < count - 1; j++) {
                    const intersect = checkIntersection2D(flatPoints[i], flatPoints[i + 1], flatPoints[j], flatPoints[j + 1]);
                    if (intersect) {
                        for (let k = 0; k < count; k++) {
                            const distA = Math.abs(k - i);
                            if (distA < influenceWidth * 2) {
                                targetPoints[k].z -= (offsetHeight * 0.5) * Math.exp(-Math.pow(distA, 2) / (2 * Math.pow(influenceWidth, 2)));
                            }
                            const distB = Math.abs(k - j);
                            if (distB < influenceWidth * 2) {
                                targetPoints[k].z += (offsetHeight * 0.5) * Math.exp(-Math.pow(distB, 2) / (2 * Math.pow(influenceWidth, 2)));
                            }
                        }
                    }
                }
            }

            return smoothPoints(targetPoints, Math.max(2, smoothPasses));
        }

        function generateTubeGeometry(curve, density, thickness) {
            const radialSegments = 128; // Increased from 64 to 128 for perfect cylinder smoothness
            return new THREE.TubeGeometry(curve, density, thickness, radialSegments, false);
        }

        function setupDrawingHandlers() {
            drawingCanvas.addEventListener('mousedown', startDrawing);
            drawingCanvas.addEventListener('mousemove', draw);
            window.addEventListener('mouseup', stopDrawing);
            drawingCanvas.addEventListener('mouseleave', stopDrawing);
            window.addEventListener('blur', stopDrawing);

            drawingCanvas.addEventListener('touchstart', (e) => {
                if (currentMode !== 'draw') return;
                if (e.touches.length > 0) startDrawing(e.touches[0]);
            }, { passive: true });
            drawingCanvas.addEventListener('touchmove', (e) => {
                if (currentMode !== 'draw') return;
                if (e.touches.length > 0) draw(e.touches[0]);
            }, { passive: true });
            window.addEventListener('touchend', stopDrawing);
        }

        function startDrawing(event) {
            if (currentMode !== 'draw') return;
            isDrawing = true;
            currentPathPoints = [];
            activeTubeMesh = null;

            const firstPoint = get3DPointFromEvent(event);
            if (firstPoint) currentPathPoints.push(firstPoint);
        }

        function draw(event) {
            if (!isDrawing || currentMode !== 'draw') return;

            const nextPoint = get3DPointFromEvent(event);
            if (!nextPoint) return;

            const lastPoint = currentPathPoints[currentPathPoints.length - 1];
            if (nextPoint.distanceTo(lastPoint) > 0.05) {
                currentPathPoints.push(nextPoint);
                updateFlatLineRealtime();
            }
        }

        function updateFlatLineRealtime() {
            if (currentPathPoints.length < 2) return;

            const smoothPasses = Math.min(2, parseInt(document.getElementById('smoothing').value));
            const smoothedRaw = smoothPoints(currentPathPoints, smoothPasses);
            if (smoothedRaw.length < 2) return;

            const curve = new THREE.CatmullRomCurve3(smoothedRaw, false, 'centripetal');
            const thickness = parseFloat(document.getElementById('thickness').value);
            const baseDensity = 500;

            const curveLength = curve.getLength();
            const segmentsCount = Math.max(120, Math.floor(curveLength * baseDensity * 0.15));

            const spacedPoints = curve.getSpacedPoints(segmentsCount);
            const smoothCurve = new THREE.CatmullRomCurve3(spacedPoints, false, 'centripetal');

            const geometry = generateTubeGeometry(smoothCurve, segmentsCount, thickness);

            if (activeTubeMesh) {
                activeTubeMesh.geometry.dispose();
                activeTubeMesh.geometry = geometry;
            } else {
                activeTubeMesh = new THREE.Mesh(geometry, material);
                scene.add(activeTubeMesh);
            }
        }

        function updateAllLineGeometries() {
            drawnLines.forEach(line => {
                const isMorphing = activeMorphs.some(m => m.mesh === line.mesh);
                if (isMorphing) return;

                if (!line.mesh || !line.mesh.geometry) return;

                const targetPoints = rebuildPathWith3DDepth(line.rawPoints);
                if (targetPoints.length < 4) return;

                const curve = new THREE.CatmullRomCurve3(targetPoints, false, 'centripetal');
                const thickness = parseFloat(document.getElementById('thickness').value);
                const baseDensity = 500;
                
                const curveLength = curve.getLength();
                const density = Math.max(120, Math.floor(curveLength * baseDensity * 0.15));

                line.mesh.geometry.dispose();
                line.mesh.geometry = generateTubeGeometry(curve, density, thickness);
            });

            activeMorphs.forEach(morph => {
                if (morph.rawPoints) {
                    morph.endPoints = rebuildPathWith3DDepth(morph.rawPoints);
                    const smoothPasses = parseInt(document.getElementById('smoothing').value);
                    morph.startPoints = smoothPoints(morph.rawPoints, smoothPasses);
                }
            });
        }

        function updateBgMeshTransform() {
            if (!bgMesh) return;
            const scaleVal = parseFloat(document.getElementById('bg-scale').value);
            const offsetX = parseFloat(document.getElementById('bg-offset-x').value);
            const offsetY = parseFloat(document.getElementById('bg-offset-y').value);
            const opacityVal = parseFloat(document.getElementById('bg-opacity').value) / 100;
            
            bgMesh.scale.set(scaleVal, scaleVal, 1.0);
            bgMesh.position.set(offsetX, offsetY, -4.5);
            bgMesh.material.opacity = opacityVal;
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            
            lastMouseX = null;
            lastMouseY = null;

            if (currentPathPoints.length >= 4 && activeTubeMesh) {
                showToast("⚡ Smooth 3D Move...");

                const smoothPasses = parseInt(document.getElementById('smoothing').value);
                const flatPoints = smoothPoints(currentPathPoints, smoothPasses);
                const targetPoints = rebuildPathWith3DDepth(currentPathPoints);

                if (targetPoints.length >= 4) {
                    drawnLines.push({
                        rawPoints: [...currentPathPoints],
                        mesh: activeTubeMesh
                    });

                    startMorphTransition(activeTubeMesh, flatPoints, targetPoints);
                    currentLineMeshes.push(activeTubeMesh);
                    activeTubeMesh = null;
                } else {
                    scene.remove(activeTubeMesh);
                    activeTubeMesh.geometry.dispose();
                    activeTubeMesh = null;
                }
            } else if (activeTubeMesh) {
                scene.remove(activeTubeMesh);
                activeTubeMesh.geometry.dispose();
                activeTubeMesh = null;
            }
            currentPathPoints = [];
        }

        function startMorphTransition(mesh, startPts, endPts) {
            activeMorphs.push({
                mesh: mesh,
                startPoints: startPts,
                endPoints: endPts,
                progress: 0,
                duration: 1.0,
                easing: (t) => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t
            });
        }

        function smoothPoints(pts, passes) {
            if (pts.length < 3 || passes === 0) return pts;
            let smoothed = pts.map(p => p.clone());
            for (let pass = 0; pass < passes; pass++) {
                const next = [smoothed[0].clone()];
                for (let i = 1; i < smoothed.length - 1; i++) {
                    next.push(new THREE.Vector3(
                        smoothed[i-1].x * 0.25 + smoothed[i].x * 0.5 + smoothed[i+1].x * 0.25,
                        smoothed[i-1].y * 0.25 + smoothed[i].y * 0.5 + smoothed[i+1].y * 0.25,
                        smoothed[i-1].z * 0.25 + smoothed[i].z * 0.5 + smoothed[i+1].z * 0.25
                    ));
                }
                next.push(smoothed[smoothed.length-1].clone());
                smoothed = next;
            }
            return smoothed;
        }

        function checkIntersection2D(p1, p2, p3, p4) {
            const d = (p4.y-p3.y)*(p2.x-p1.x) - (p4.x-p3.x)*(p2.y-p1.y);
            if (d === 0) return null;
            const ua = ((p4.x-p3.x)*(p1.y-p3.y) - (p4.y-p3.y)*(p1.x-p3.x)) / d;
            const ub = ((p2.x-p1.x)*(p1.y-p3.y) - (p2.y-p1.y)*(p1.x-p3.x)) / d;
            if (ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1) {
                return new THREE.Vector2(p1.x + ua*(p2.x-p1.x), p1.y + ua*(p2.y-p1.y));
            }
            return null;
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            for (let i = activeMorphs.length - 1; i >= 0; i--) {
                const m = activeMorphs[i];
                m.progress += dt / m.duration;
                if (m.progress >= 1.0) m.progress = 1.0;

                const eased = m.easing(m.progress);
                const cur = [];
                for (let k = 0; k < m.startPoints.length; k++) {
                    cur.push(new THREE.Vector3().lerpVectors(m.startPoints[k], m.endPoints[k], eased));
                }

                const curve = new THREE.CatmullRomCurve3(cur, false, 'centripetal');
                const thickness = parseFloat(document.getElementById('thickness').value);
                const baseDensity = 500;
                
                const curveLength = curve.getLength();
                const density = Math.max(120, Math.floor(curveLength * baseDensity * 0.15));

                m.mesh.geometry.dispose();
                m.mesh.geometry = generateTubeGeometry(curve, density, thickness);

                if (m.progress >= 1.0) activeMorphs.splice(i, 1);
            }

            if (controls.enabled) {
                controls.update();
                if (controls.state === -1) {
                    drawingCanvas.style.cursor = 'grab';
                } else {
                    drawingCanvas.style.cursor = 'grabbing';
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
